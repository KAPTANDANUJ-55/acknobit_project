<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="register.css">
    <title>Acknobit AI - Admin Registration</title>
</head>
<body>
    <header class="header-container">
        <h1>Acknobit AI</h1>
        <nav class="nav-bar">
            <ul>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-container">
        <div class="loginc">
            <div class="loginbox">
                <div id="success-overlay" style="display:none; text-align:center;">
                    <h2 class="success-title">Account Created</h2>
                    <p class="success-subtitle">Redirecting to Login...</p>
                </div>

                <div id="register-content">
                    <div class="tag-badge">ADMIN Panel</div>
                    <h3 class="logwa">Create Account</h3>
                    <p class="desc">Register for developer and administrative access</p>

                    <form id="registerForm" novalidate>
                        <div class="inputg">
                            <input type="text" id="fullName" name="fullName" placeholder="Full Name" required>
                        </div>
                        <div class="inputg">
                            <input type="email" id="mail" name="email" placeholder="Email Address" required>
                        </div>
                        <div class="inputg">
                            <input type="password" id="password" name="password" placeholder="Password" required>
                        </div>
                        <div class="inputg">
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required>
                        </div>
                        <button type="submit" class="but">Create Account</button>
                        
                        <div class="login-footer">
                            <div class="jaruri">
                                <p class="alt-action">Already registered? <a href="login.html">Sign In</a></p>
                                <a href="index.html" class="back-link">← Back to Home</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div> 
    </main>

    <footer>
        © 2026 Acknobit AI. All rights reserved.
    </footer>

<script>
const form = document.getElementById('registerForm');
const registerContent = document.getElementById('register-content');
const successOverlay = document.getElementById('success-overlay');

form.addEventListener('submit', function(e) {
    e.preventDefault();
    
    let isValid = true;
    document.querySelectorAll('.error-msg').forEach(el => el.remove());
    document.querySelectorAll('input').forEach(el => el.style.borderColor = '');
    
    const fullName = document.getElementById("fullName");
    const mail = document.getElementById("mail");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");

    const inputs = [fullName, mail, password, confirmPassword];

    inputs.forEach(input => {
        if (!input.value.trim()) {
            isValid = false;
            input.style.borderColor = '#ef4444';
            const err = document.createElement('span');
            err.className = 'error-msg';
            err.style.cssText = 'color: #ef4444; font-size: 0.8rem; display: block; margin-top: -10px; margin-bottom: 12px; text-align: left;';
            err.textContent = "Please fill in this field";
            input.parentNode.appendChild(err);
        }
    });

    if (isValid && password.value.trim() !== confirmPassword.value.trim()) {
        isValid = false;
        confirmPassword.style.borderColor = '#ef4444';
        const err = document.createElement('span');
        err.className = 'error-msg';
        err.style.cssText = 'color: #ef4444; font-size: 0.8rem; display: block; margin-top: -10px; margin-bottom: 12px; text-align: left;';
        err.textContent = "Passwords do not match";
        confirmPassword.parentNode.appendChild(err);
    }
    
    if (isValid) {
        const userData = {
            Username: fullName.value.trim(),
            email: mail.value.trim().toLowerCase(),
            password: password.value.trim()
        };

        fetch("http://localhost:8080/Admin/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(userData)
        })
        .then(async response => {
            const data = await response.json();
            if (response.ok) {
                if (registerContent && successOverlay) {
                    registerContent.style.display = "none";
                    successOverlay.style.display = "block";
                }
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2000);
            } else {
                alert("REGISTRATION FAILED: " + (data.message || "Could not complete registration"));
            }
        })
        .catch(error => {
            console.error("Server Error: ", error);
            alert("SERVER SIDE ISSUE: Connection Failed");
        });
    }
});
</script>
</body>
</html>
