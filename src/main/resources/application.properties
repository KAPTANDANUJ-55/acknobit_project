spring.application.name=acknobit
server.port=8080

# Spring AI Google GenAI Setup
spring.ai.openai.api-key=YOUR_API_KEY

spring.ai.openai.base-url=YOUR_OPENAI_URL
spring.ai.openai.chat.options.model=YOUR_MODEL


spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=jdbc:mysql://mysql:3306/anyscore
spring.datasource.username=
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.format_sql=true

upload-dir=uploads/avatars
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true